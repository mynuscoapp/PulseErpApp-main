<div class="row">
    <div class="col-sm-12">
        <app-card>
            <div class="form-controls">
                <form [formGroup]="aznpaymentsform">
                    <div class="form-controls">
                        <table>
                            <tr align="center">
                                <td><label formControlName="lblstartdate" >Start Date</label></td>
                                <td><label formControlName="lblenddate">End Date</label></td>
                                <td><label formControlName="lblinterval" >Select Intervals</label></td>
                                <td><label formControlName="lblgroupby">Group By</label></td>
                                <td><label formControlName="lblfilterby">Filter By</label></td>
                                <td><label formControlName="lblfiltervalue">Filter Value</label></td>
                            </tr>
                            <tr>
                                <td><input formControlName="startdateparam" type="date" [(ngModel)]="startdateparam"
                                        placeholder="Start Date" /></td>
                                <td><input formControlName="enddateparam" type="date" [(ngModel)]="enddateparam"
                                        placeholder="End Date" /></td>
                                <td><select formControlName="intervals">
                                        <option value="Summary">Summary</option>
                                        <option value="Day">Daily</option>
                                        <option value="Month">Monthly</option>
                                        <option value="Weekly">Weekly</option>
                                    </select></td>
                                <td><select formControlName="groupby">
                                        <option value="None">None</option>
                                        <option value="Category">Category</option>
                                        <option value="Product">Product</option>
                                        <option value="SKU">SKU</option>
                                    </select></td>
                                <td><select formControlName="filterby" id="filterby" [(ngModel)]="selectedfilterby"
                                        (change)="onFilterByChange($event)">
                                        <option value="None">None</option>
                                        <option value="Category">Category</option>
                                        <option value="Product">Product</option>
                                        <option value="SKU">SKU</option>
                                    </select></td>
                                <!--<td><input type="text" formControlName="filtervalue" placeholder="Enter Filter Value" /></td>-->
                                <td><select formControlName="filtervalue" id="filtervalue" [(ngModel)]="selectedfiltervalue"><!--</select> data-live-search="true" class="selectpicker">-->
                                     <option disabled> Select Filter Value</option>
                                     <option *ngFor="let val of filtervalues" [value]="val.value">{{ val.value }}</option>
                                </select>
                                    <!--<ng-select [items]="filtervalues" bindLabel="" bindValue=""
                                        placeholder="Select Filter Value" formControlName="filtervalue"
                                        [(ngModel)]="selectedfiltervalue" [searchable]="true" [clearable]="true">
                                    </ng-select>-->
                                </td>
                                </tr>
                                <tr>                                
                                <td><button type="button" class="btn btn-primary col-sm-1.5"
                                        (click)="loadPayments()">Submit</button></td>
                                <td><button type="button" class="btn btn-primary col-sm-1.5" (click)="onExport()">
                                        Export</button></td>
                                <td><button type="button" class="btn btn-primary col-sm-1.5" (click)="onClearselection()">
                                        Clear Selection</button></td>
                            </tr>
                        </table>
                    </div>
                    <div>
                        <ag-grid-angular #agGrid style="width: 100%; height: 500px; " class="ag-theme-alpine"
                            [columnDefs]="colDefs" [rowData]="rowData" [gridOptions]="gridOptions"  (gridReady)="onGridReady($event)"
                            >
                        </ag-grid-angular>
                    </div>
                    <div>
                        <ag-charts style="width: 100%;" [options]="chartOptions">
                        </ag-charts>
                    </div>
                 </form>
            </div>
        </app-card>
    </div>
</div>
