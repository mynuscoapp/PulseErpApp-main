<div class="row">
    <div class="col-sm-12">
        <app-card>
            <form [formGroup]="aznpaymentsform">
                <div class="col-sm-12" style="display: flex;">
                    <div class="col-sm-2">
                        <input formControlName="startdateparam" type="date" [(ngModel)]="startdateparam"
                            placeholder="Start Date" />
                    </div>
                    <div class="col-sm-2">
                        <input formControlName="enddateparam" type="date" [(ngModel)]="enddateparam"
                            placeholder="End Date" />
                    </div>

                    <div class="col-sm-2">
                        <select formControlName="intervals">
                            <option disabled value="">Select Intervals</option>
                            <option value="Summary">Summary</option>
                            <option value="Day">Day</option>
                            <option value="Month">Month</option>
                            <option value="Weekly">Weekly</option>
                        </select>
                    </div>
                    <div class="col-sm-2">
                        <select formControlName="groupby">
                            <option disabled value="">Group By</option>
                            <option value="None">None</option>
                            <option value="Category">Category</option>
                            <option value="Product">Product</option>
                            <option value="SKU">SKU</option>
                        </select>
                    </div>
                    <div class="col-sm-2">
                        <select formControlName="filterby">
                            <option disabled value="">Filter By</option>
                            <option value="None">None</option>
                            <option value="Category">Category</option>
                            <option value="Product">Product</option>
                            <option value="SKU">SKU</option>
                        </select>
                    </div>
                    <div class="col-sm-2">
                        <input type="text" formControlName="filtervalue" placeholder="Enter Filter Value" />
                    </div>

                </div>
                <div class="col-sm-8" style="display: flex;margin-top: 5px;">
                    <div class="col-sm-4">
                        <button type="button" class="btn btn-primary" (click)="loadPayments()">Submit</button>

                        <button type="button" class="btn btn-primary" (click)="onExport()">Export</button>
                    </div>
                </div>
                <ag-grid-angular #agGrid style="width: 100%; height: 450px; " class="ag-theme-alpine"
                    [columnDefs]="colDefs" [rowData]="rowData" />

<div class="form-controls">
    <form [formGroup]="aznpaymentsform">
        <div>
            <input formControlName="startdateparam" type="date" [(ngModel)]="startdateparam" placeholder="Start Date" />
            <input formControlName="enddateparam" type="date" [(ngModel)]="enddateparam" placeholder="End Date" />
            <select formControlName="intervals">
                <option disabled value="">Select Intervals</option>
                <option value="Summary">Summary</option>
                <option value="Day">Daily</option>
                <option value="Month">Monthly</option>
                <option value="Weekly">Weekly</option>
            </select>
            <select formControlName="groupby">
                <option disabled value="">Group By</option>
                <option value="None">None</option>
                <option value="Category">Category</option>
                <option value="Product">Product</option>
                <option value="SKU">SKU</option>
            </select>
            <select formControlName="filterby">
                <option disabled value="">Filter By</option>
                <option value="None">None</option>
                <option value="Category">Category</option>
                <option value="Product">Product</option>
                <option value="SKU">SKU</option>
            </select>
            <input type="text" formControlName="filtervalue" placeholder="Enter Filter Value" />

            <button type="button" class="btn btn-primary col-sm-1.5" (click)="loadPayments()">Submit</button>
            <button type="button" class="btn btn-primary col-sm-1.5" (click)="loadCharts()">Load Chart</button>
        </div>
        <div>
            <ag-grid-angular #agGrid style="width: 100%; height: 500px; " class="ag-theme-alpine" [columnDefs]="colDefs"
                [rowData]="rowData" />
        </div>

            </form>
        </app-card>
    </div>
    </form>

</div>
