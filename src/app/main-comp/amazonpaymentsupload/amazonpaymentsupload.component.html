<div class="mainContainer">
    <div class="content">
        <app-card>
        <div class="row">

            <div class="col-md-4">

            </div>
            <div class="col-md-4">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text upload" (click)="upload()"  id="btnUpload">Upload</span>
                    </div>
                    <div class="custom-file">
                        <form method="post" enctype="multipart/form-data">
                            <input  (change)="fileChange($event)" accept=".csv" type="file" name="AznPaymentsUpload" class="custom-file-input" id="AznPaymentsUpload" aria-describedby="inputGroupFileAddon01" multiple>
                        </form>
                        <label class="custom-file-label" for="inputGroupFile01">Choose file</label>
                    </div>
                    
                </div>
            </div>
            <div class="col-md-4">
                <div *ngFor="let document of documentList; let i = index">
                    {{document.name}}
                 </div>
            </div>
        </div>
    </app-card>
    </div>
</div>
